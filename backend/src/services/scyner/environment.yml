name: scyner
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.12.9
  - mlflow==2.22.0
  - cloudpickle==3.1.1
  - dill
  - jinja2
  - numpy<2.0
  - pandas
  - scikit-learn
  - scipy
  - torchvision
  - uvicorn
  - gunicorn
  - redis
  - pip
  - pip:
    - pydantic-settings
    - -e ./CyNER
